<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RuangPustaka UNAND</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah scroll ganda */
            background-color: #f8fafc;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe id="app-frame" allowfullscreen="true"></iframe>

    <script>
        // Masukkan link deployment Google Apps Script Anda di bawah ini
        const gasUrl = "https://script.google.com/macros/s/AKfycbww3zi_NOz0zBY6XVlQb4Vf3ZJxYnAC3APAv-fJiJXc_v-ft_zyzzDyzo-wbK-TeTXl3g/exec";
        
        // Menangkap parameter dari URL GitHub (misal: ?page=login) dan meneruskannya ke iframe
        const urlParams = window.location.search;
        document.getElementById("app-frame").src = gasUrl + urlParams;
    </script>

</body>
</html>
